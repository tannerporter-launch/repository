{% extends "base.html" %}{% block body %}
<p><a href="/clients/{{ project.client_id }}">← {{ project.client }}</a></p>
<h1>{{ project.name }}</h1>
<div class="card"><form method="post" action="/projects/{{ project.id }}" class="row">
<input name="name" value="{{ project.name }}" required><input name="due_date" type="date" value="{{ project.due_date }}">
<input name="budget" type="number" step="0.01" value="{{ project.budget }}">
<select name="status">{% for s in statuses %}<option {{ 'selected' if s == project.status }}>{{ s }}</option>{% endfor %}</select>
<button>Save</button></form>
<form method="post" action="/projects/{{ project.id }}/delete" onsubmit="return confirm('Delete project?')">
<button class="danger" style="margin-top:8px">Delete project</button></form></div>
<div class="card"><h3>Tasks</h3>
{% for t in tasks %}<div class="row" style="padding:4px 0">
<form method="post" action="/tasks/{{ t.id }}/toggle"><button class="link">{{ '☑' if t.done else '☐' }}</button></form>
<span class="{{ 'done' if t.done }}">{{ t.title }}</span>
{% if t.due_date %}<span class="{{ 'bad' if not t.done and t.due_date < today else 'muted' }}">{{ t.due_date }}</span>{% endif %}
<form method="post" action="/tasks/{{ t.id }}/delete"><button class="link">✕</button></form></div>
{% else %}<p class="muted">No tasks.</p>{% endfor %}
<form method="post" action="/projects/{{ project.id }}/tasks" class="row" style="margin-top:12px">
<input name="title" placeholder="New task" required><input name="due_date" type="date"><button>Add</button></form></div>
{% endblock %}
