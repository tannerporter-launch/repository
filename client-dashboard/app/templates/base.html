<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Client Dashboard{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#e6e8eb;--muted:#9aa3af;--line:#2a2f38;--accent:#60a5fa;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
nav{display:flex;gap:16px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
nav a{color:var(--text);text-decoration:none;font-weight:500}nav .sp{flex:1}
main{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:28px}.muted{color:var(--muted)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
a{color:var(--accent)}input,select,textarea,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}
button{cursor:pointer;background:var(--accent);color:#fff;border:0}button.link{background:none;color:var(--muted);padding:0}
button.danger{background:var(--bad)}form.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:2px 8px;border-radius:99px;background:var(--line);font-size:12px}
.done{text-decoration:line-through;color:var(--muted)}
</style></head><body>
{% if request.session.get('ok') %}
<nav><a href="/">Dashboard</a><a href="/clients">Clients</a><span class="sp"></span>
<form method="post" action="/logout"><button class="link">Log out</button></form></nav>
{% endif %}
<main>{% block body %}{% endblock %}</main></body></html>
